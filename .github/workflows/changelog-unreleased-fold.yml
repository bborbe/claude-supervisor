name: Changelog Unreleased Fold Precheck

# The PR-time half of the changelog fold guard.
#
# A release cut renames the top `## Unreleased` to `## vX.Y.Z`. A PR branched
# before the cut still carries `## Unreleased`, and the forge's merge resolution
# matches the bullet list rather than the heading — so the PR's new bullets are
# spliced into the already-released section. The merge is clean, nothing warns,
# and the changelog claims work the tag does not contain.
#
# `changelog-fold.yml` catches that AFTER it has landed, on the push to master.
# That is why the repo went red for 91 consecutive master runs on 2026-10-30/31,
# one failure mail each. This workflow asks the same question BEFORE the merge:
# it checks out the PR head and lets the guard compute the merge itself with
# `git merge-tree`, then fails the PR when a pending bullet would land under a
# released heading.
#
# `@master` rather than a pinned tag is deliberate, matching `changelog-fold.yml`:
# the guard is one tool with one source of truth, and a stale pin would silently
# keep an older check running.
#
# The guard tool ships from bborbe/coding; this file is only the wiring.

on:
  pull_request:
    # `edited` is not noise: retargeting a PR's base branch fires only that
    # event, so without it a PR opened against one base and later retargeted to
    # master keeps a green check computed against the old base — and the merge
    # into master, the one that can fold, is never prechecked. The title/body
    # edits that also fire it are only cheap when the branch carries
    # nothing pending: the guard exits before computing a merge unless the
    # head's topmost heading is `## Unreleased` AND the base's is a released
    # `## vX.Y.Z`. A PR with pending work pays a full merge-tree on each edit,
    # which is the cost of not missing a retarget.
    types: [opened, synchronize, reopened, edited]

jobs:
  changelog-unreleased-fold:
    uses: bborbe/coding/.github/workflows/changelog-unreleased-fold-guard.yml@master
