name: Changelog Fold Guard

# A release cut renames `## Unreleased` to `## vX.Y.Z`. A PR branched before the
# cut still carries `## Unreleased`, and GitHub's merge resolution matches the
# bullet list rather than the heading — so the PR's bullets are spliced into the
# already-released section. The merge is clean, nothing warns, and the changelog
# claims work the tag does not contain. With no `## Unreleased` left, the release
# watcher has nothing to cut and this repo silently stops releasing. Six such
# folds were repaired by hand here and in two sibling repos before this guard.
#
# WHY `push` ON MASTER, AND WHY THE TRIGGER LIVES HERE:
# the fold happens in GitHub's merge resolution, after the branch is already
# final. A check that reads the branch's HEADING is structurally blind to it, and
# it cannot be a rule in bborbe/coding's rule base either, because the pr-review
# bot evaluates rules on the PR. `push` on master is the only event that sees the
# fold as a fact rather than a prediction.
#
# The prediction lives in `changelog-unreleased-fold.yml`: it checks out the PR
# head and computes the merge with `git merge-tree`, so the fold is caught before
# it lands instead of after. This job stays as the backstop — it is the one that
# reads the real merged tree, so a prediction that misses still cannot hide.
#
# `@master` rather than a pinned tag is deliberate: the guard is one tool with one
# source of truth, and a stale pin would silently keep an older check running.
#
# The guard tool ships from bborbe/coding; this file is only the wiring.

on:
  push:
    branches: [master]

jobs:
  changelog-fold:
    uses: bborbe/coding/.github/workflows/changelog-fold-guard.yml@master
